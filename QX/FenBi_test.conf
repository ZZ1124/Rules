#!name=粉笔 FenBi 去广告 & 精简页面（Quantumult X）
#!desc=移除开屏广告、弹窗广告、悬浮广告、热门搜索，移除底栏皮肤，精简我的页面
#!author=可莉🅥
#!category=App
#!tag=去广告
#!date=2025-11-27

########################################
# Rewrite - Map Local / Reject
########################################

# 首页 Banner / 信息流广告
^https:\/\/keapi\.fenbi\.com\/app\/(iphone|ipad)\/position_resource\/get_banners\? url reject-200

# 首页 Banner（推荐广告，类型 2）
^https:\/\/keapi\.fenbi\.com\/app\/(iphone|ipad)\/position_resource\/get_home_banners\?.*position_resource_type=2 url reject-200

# 首页 Banner（类型 1）返回静态占位，防止页面空白
^https:\/\/keapi\.fenbi\.com\/app\/(iphone|ipad)\/position_resource\/get_home_banners\?.*position_resource_type=1 url response-body {"code":1,"msg":"","data":{"positionResourceType":1,"payload":{"items":[{"id":17868,"content":"static","imageUrl":"https://i.im.ge/2025/11/24/4DrVp0.mm.png","redirectType":0}],"count":1}} status-code 200

# 开屏 / 推荐页轮播广告
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/recommend\/info\? url response-body {"code":1,"msg":"","data":{}} status-code 200

# 热门搜索词
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/topic\/hotquery\/list\? url reject-200

# 公告页热门搜索
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/announcement\/hotquery\/list\? url reject-200

# 探索页活动入口
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/explore\/consts\? url reject-200

# 今日课程 / 公共课推荐
^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/timetable\/today_with_public_episodes\? url reject-200

# 红点提示（活动 / 消息）
^https:\/\/keapi\.fenbi\.com\/app\/iphone\/\w+\/reddot\? url reject-200

# AI / 学习助手入口
^https:\/\/market-api\.fenbi\.com\/(iphone|ipad)\/v1\/assistant\/info\? url reject-200

# 我的页面 - 助手入口
^https:\/\/market-api\.fenbi\.com\/(iphone|ipad)\/v1\/assistant\/my\? url reject-200

# 会员中心推广入口
^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/user_member\/entry\? url reject-200


########################################
# Rewrite - Response Body（去底栏皮肤）
########################################

# 底栏图标皮肤（默认 / 选中 / 夜间模式）
^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/apps\/config\? url response-body {"code":1,"msg":"","data":{}} status-code 200


########################################
# MITM
########################################

hostname = keapi.fenbi.com, market-api.fenbi.com, ke.fenbi.com, hera-webapp.fenbi.com
