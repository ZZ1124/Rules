#!name=粉笔 FenBi 去广告 & 精简页面（Quantumult X）
#!desc=移除开屏广告、信息流广告、热门搜索、活动入口，精简首页与我的页面
#!author=可莉🅥
#!category=App
#!tag=去广告
#!date=2025-11-27

########################################
# Rewrite - 广告 / 推荐拦截
########################################

# 首页信息流 Banner
^https:\/\/keapi\.fenbi\.com\/app\/(iphone|ipad)\/position_resource\/get_banners\? url reject

# 首页推荐 Banner（类型 2）
^https:\/\/keapi\.fenbi\.com\/app\/(iphone|ipad)\/position_resource\/get_home_banners\?.*position_resource_type=2 url 
# 开屏 / 推荐页轮播广告
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/recommend\/info\? url response-body '{"code":1,"msg":"","data":{}}' status-code 200

# 热门搜索词
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/topic\/hotquery\/list\? url reject

# 公告页热门搜索
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/announcement\/hotquery\/list\? url reject

# 探索页活动入口
^https:\/\/hera-webapp\.fenbi\.com\/(iphone|ipad)\/explore\/consts\? url reject

# 今日课程 / 公共课推荐
^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/timetable\/today_with_public_episodes\? url reject

# 红点提示（活动 / 消息）
^https:\/\/keapi\.fenbi\.com\/app\/iphone\/\w+\/reddot\? url reject

# AI / 学习助手入口
^https:\/\/market-api\.fenbi\.com\/(iphone|ipad)\/v1\/assistant\/info\? url reject

# 我的页面 - 助手入口
^https:\/\/market-api\.fenbi\.com\/(iphone|ipad)\/v1\/assistant\/my\? url reject

# 会员中心推广入口
^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/user_member\/entry\? url reject


########################################
# Rewrite - 去底栏皮肤（返回空配置）
########################################

# 底栏图标皮肤 / 夜间模式皮肤
^https:\/\/ke\.fenbi\.com\/(iphone|ipad)\/v3\/apps\/config\? url response-body '{"code":1,"msg":"","data":{}}' status-code 200


########################################
# MITM
########################################

# 开屏广告
^https:\/\/tiku\.fenbi\.com\/activity\/app\/launcher reject-dict
# 首页 - 弹窗
^https:\/\/keapi\.fenbi\.com\/app\/iphone\/\w+\/popup reject-dict
# 首页 - 新用户注册送好礼全屏弹窗
^https:\/\/market-api\.fenbi\.com\/iphone\/v1\/assistant\/info reject-dict
# 首页 - 悬浮窗 - 笔面常备资料
^https:\/\/market-api\.fenbi\.com\/iphone\/v1\/assistant\/entrance\/show reject-dict
# 首页 - 轮播图 [会有空白占位]
# ^https:\/\/tiku\.fenbi\.com\/iphone\/\w+\/banners\/v2 reject-dict
# 首页 - 横向滚动板块
# ^https:\/\/keapi\.fenbi\.com\/app\/iphone\/\w+\/small_banner reject-dict
# keapi.fenbi.com, market-api.fenbi.com, tiku.fenbi.com

hostname = keapi.fenbi.com, market-api.fenbi.com, ke.fenbi.com, hera-webapp.fenbi.com

