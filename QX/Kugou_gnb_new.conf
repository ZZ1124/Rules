#!name=酷狗概念版
#!category=酷狗概念版界面优化



[MITM]
hostname =  %APPEND% *.kugou.com




[Rewrite]


^https:\/\/gateway\.kugou\.com\/card\/v1\/pxy\/youth_recommend url jsonjq-response-body .data.responses[].body = {} | .data.responses[].msg = []  | .data.card_rank = []
#| .data.responses[].has_cache = 1
#发现 大家都在听及下方

^https:\/\/gateway\.kugou\.com\/card\/v1\/pxy\/listen url jsonjq-response-body .data.responses[].body = {}
#发现 概念实验室

#^https:\/\/gateway\.kugou\.com\/ads\.gateway\/v2\/lite_v_youth_home_banner url jsonjq-response-body .data.responses[].body = {}
#发现 广告
^https:\/\/gateway\.kugou\.com\/ads\.gateway\/v2\/lite_v_youth_home_banner url jsonjq-response-body .data.ads = {}

^https:\/\/gateway\.kugou\.com\/ads\.gateway\/v2\/lite_v_search_no_focus url jsonjq-response-body .data.ads.lite_v_search_no_focus = []

^https:\/\/gateway\.kugou\.com\/persnfm\.service\/v2\/personal_recommend url jsonjq-response-body .data.song_list=[] | .data.hotsong_num=0
#radio （个人推荐歌单清空，热门歌曲数置0）

^http:\/\/mobilecdngz\.kugou\.com\/api\/v3\/album\/info url jsonjq-response-body .data = {}
#专辑信息接口返回空（可能用于屏蔽某些专辑详情）

^https:\/\/gateway\.kugou\.com\/v1\/activity\/get_listen_song_task jsonjq-response-body .error_code = 0
#听歌任务接口强制返回成功（error_code=0）

^https:\/\/gateway\.kugou\.com\/youth\/v1\/song\/has_similar_song url jsonjq-response-body .data.has_stat =  0
#类似歌曲统计相关字段置0（可能防推荐或防上报）

^https:\/\/lyrics\.kugou\.com\/v1\/search url jsonjq-response-body .[]
#歌词搜索接口整体清空（返回空数组）

#搜索

^https:\/\/gateway\.kugou\.com\/goddess\/v1\/content\/biz_list url jsonjq-response-body .data.list = [] | .data.next_page = 0 | .data.has_next = 0
#搜索 广告（女神相关内容/广告列表清空）

^https:\/\/gateway\.kugou\.com\/youth\/v1\/channel\/search_recommend_list url jsonjq-response-body .data.list = [] | .data.total = []       | .data.is_end = 0
#搜索 推荐里面内容（搜索页推荐列表清空）

^https:\/\/gateway\.kugou\.com\/youth\/v1\/channel\/tab_list url jsonjq-response-body .data.list = []
#搜索 推荐右边的（搜索页推荐tab/分类清空）

#乐库

^http:\/\/kugroup\.mobile\.kugou\.com\/api\/v3\/member\/follow_list url  jsonjq-response-body .data.groups = []
#关注/收藏分组清空（乐库相关）

^https:\/\/gateway\.kugou\.com\/youth\/v1\/ab\/tmeab url jsonjq-response-body .data.cube.mapParams.row_num = []
#AB测试相关参数清空（可能是布局/行数控制）

^https:\/\/gateway\.kugou\.com\/youth\/v1\/diy\/get_component_detail url jsonjq-response-body .data.float_widget = {}
#DIY组件详情中的悬浮组件清空

^https:\/\/adservice\.kugou\.com\/v2\/lite_v_youth_player_widget url jsonjq-response-body .data.ads.lite_v_youth_player_widget = []
#播放器页面小部件广告清空

^https:\/\/gateway\.kugou\.com\/youth\/v1\/ai\/sync_material_list url  jsonjq-response-body .data.list = []
#AI相关素材列表清空

^https:\/\/gateway\.kugou\.com\/msg\.mobile\/v3\/sync\/poll url jsonjq-response-body  .list = []
#消息轮询列表清空（可能防推送/通知）

^https:\/\/youthimgbssdl\.kugou\.com\/(a55229cc031dbd82a1d515e02966f9e9|9c56296957fa5efa6f739107e5e9a4e2|198e777d528621b9534f14359ae1485e|e8fd80f8c325ac3738cd5f1f088874a7|ecf4f9f28ebf5425742e1655ff3d81a4)\.png url reject-dict
#radio图片（特定几张电台/广播相关图片直接拒绝请求）

^https:\/\/gateway\.kugou\.com\/youth\/v1\/yueku\/tab url jsonjq-response-body .data.responses.body .data.ads = {}
#乐库tab内容清空



